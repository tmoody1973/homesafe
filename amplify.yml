# Amplify build config, kept in the repo rather than in the console so it is
# reviewable and versioned like everything else here.
#
# bun, not npm. The whole project is bun — `bun test`, `bun run migrate`,
# `bun run evidence` — and web/ carries a bun.lock with no package-lock.json.
# The first build failed on `npm ci` for exactly that reason. Adding a second
# lockfile to satisfy the build image would leave two package managers in one
# repo and two lockfiles to drift apart, so the build installs bun instead.
#
# Amplify's build image does not ship bun, hence the install step. PATH is
# exported in both phases because each phase gets a fresh shell.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export PATH="$HOME/.bun/bin:$PATH"
            - bun --version
            - bun install --frozen-lockfile
        build:
          commands:
            - export PATH="$HOME/.bun/bin:$PATH"
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
