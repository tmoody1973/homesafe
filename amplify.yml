# Amplify build config, kept in the repo rather than in the console so it is
# reviewable and versioned like everything else here.
#
# bun, not npm. The whole project is bun — `bun test`, `bun run migrate`,
# `bun run evidence` — and web/ carries a bun.lock with no package-lock.json.
# The first build failed on `npm ci` for exactly that reason. Adding a second
# lockfile to satisfy the build image would leave two package managers in one
# repo and two lockfiles to drift apart, so the build installs bun instead.
#
# Amplify's build image does not ship bun, hence the install step. PATH is
# exported in both phases because each phase gets a fresh shell.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export PATH="$HOME/.bun/bin:$PATH"
            - bun --version
            # Two installs, because there are two dependency trees. web/ imports
            # the query code from ../src, and that code imports `pg`, which Node
            # resolves from the REPO root's node_modules — not web/'s. Installing
            # only in web/ builds locally (where the root tree already exists) and
            # fails on a clean checkout with "Module not found: Can't resolve 'pg'".
            - cd .. && bun install --frozen-lockfile && cd web
            - bun install --frozen-lockfile
            # Amplify's console environment variables are BUILD-time only. A
            # runtime probe on the deployed site reported every one of them
            # ABSENT — including AMPLIFY_MONOREPO_APP_ROOT, which is certainly
            # set — so the server rendering the page could not reach the
            # database. Writing what it needs into .env.production is how
            # Next.js carries values into the server bundle.
            #
            # DATABASE_URL_APP ships as of decision 007 — a deliberate reversal
            # of the plan-3 rule, made when the app gained sign-in. The case
            # pages serve behind a signed session, every action re-checks
            # ownership in SQL, and app_rw still cannot touch audit_log or
            # public evidence. See docs/decisions/007-app-credential-on-amplify.md.
            #
            # AWS credentials are deliberately NOT here: Bedrock access comes
            # from the SSR compute role (homesafe-amplify-compute), which can
            # invoke exactly two models and nothing else. AWS_REGION arrives
            # renamed because Amplify reserves the plain name.
            - echo "DATABASE_URL_EVIDENCE=$DATABASE_URL_EVIDENCE" > .env.production
            - echo "DATABASE_URL_APP=$DATABASE_URL_APP" >> .env.production
            - echo "SESSION_SECRET=$SESSION_SECRET" >> .env.production
            - echo "AWS_REGION=$APP_AWS_REGION" >> .env.production
        build:
          commands:
            - export PATH="$HOME/.bun/bin:$PATH"
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
